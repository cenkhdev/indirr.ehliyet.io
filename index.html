<!DOCTYPE HTML>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ehliyet Sınav Soruları Uygulaması</title>

<!-- Open Graph Meta Etiketleri -->

<meta property="og:description" content="Ehliyet sınavına hazırlananlar için en iyi uygulama. Hemen indir ve sınavda başarılı ol!">
<meta property="og:image" content="https://indirr.ehliyet.io/img.png">
<meta property="og:url" content="https://puanver.ehliyet.io">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ehliyet Sınav Soruları Uygulaması">
<meta name="twitter:description" content="Ehliyet sınavına hazırlananlar için en iyi uygulama. Hemen indir ve sınavda başarılı ol!">
<meta name="twitter:image" content="https://indirr.ehliyet.io/img.png">

<script type="text/javascript">
if((navigator.userAgent.match(/iPhone/i)) || (navigator.userAgent.match(/iPod/i))) {
    window.location = "https://apps.apple.com/us/app/id6744372996";
} else if(navigator.userAgent.match(/android/i)) {
    window.location = "https://play.google.com/store/apps/details?id=com.ehliyetsorulari.cenkhoca";
} else {
	window.location = "https://apps.apple.com/us/app/id6744372996";
}
</script>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8f9fa;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
    }
    .container {
        background: #ffffff;
        padding: 35px 25px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        max-width: 380px;
        width: 100%;
        box-sizing: border-box;
    }
    .logo {
        width: 110px;
        height: 110px;
        border-radius: 22px;
        margin-bottom: 20px;
        object-fit: cover;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
        font-size: 22px;
        margin-top: 0;
        margin-bottom: 12px;
        color: #111;
    }
    p {
        font-size: 15px;
        color: #666;
        margin-bottom: 30px;
        line-height: 1.5;
    }
    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        transition: transform 0.2s, opacity 0.2s;
        box-sizing: border-box;
    }
    .btn:active {
        transform: scale(0.97);
    }
    .btn:hover {
        opacity: 0.9;
    }
    .btn-ios {
        background-color: #000000;
        color: #ffffff;
    }
    .btn-android {
        background-color: #3ddc84;
        color: #000000;
    }
    .btn-android:hover {
        background-color: #35c475;
    }
</style>
</head>
<body>
    <div class="container">
        <!-- Tasarımlardaki standart görsel -->
        <img src="https://indirr.ehliyet.io/img.png" alt="Ehliyet Cenk Hoca" class="logo">
        
        <h1>Ehliyet Cenk Hoca</h1>
        <p>Yönlendirme otomatik olarak başlamadıysa, lütfen cihazınıza uygun mağazayı seçin.</p>
        
        <a href="https://apps.apple.com/us/app/id6744372996" class="btn btn-ios">App Store'dan İndir</a>
        <a href="https://play.google.com/store/apps/details?id=com.ehliyetsorulari.cenkhoca" class="btn btn-android">Google Play'den İndir</a>
    </div>
</body>
</html>
